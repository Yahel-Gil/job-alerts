name: watch

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub sometimes runs a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    # One isolated job per company: a site that is down or slow doesn't hold up the others.
    strategy:
      fail-fast: false
      matrix:
        company: [nvidia, intel, amat, apple, microsoft]
    concurrency:
      group: scan-${{ matrix.company }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan ${{ matrix.company }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
        run: python -m jobwatch --company ${{ matrix.company }}
      - name: Save state
        if: always()
        run: bash .github/scripts/commit_state.sh "state ${{ matrix.company }}"
