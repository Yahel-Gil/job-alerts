name: watch

# The main trigger is cron-job.org calling workflow_dispatch every 15 minutes, because GitHub's own
# scheduler drops frequent runs (we saw 4 runs in 16 hours). The hourly schedule is only a backup.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

jobs:
  scan:
    # One isolated job per company: a site that is down or slow doesn't hold up the others.
    strategy:
      fail-fast: false
      matrix:
        company: [nvidia, intel, amat, apple, microsoft]
    concurrency:
      group: scan-${{ matrix.company }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan ${{ matrix.company }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
        run: python -m jobwatch --company ${{ matrix.company }}
      # Dead-man's switch: healthchecks.io alerts on Telegram when these pings stop arriving.
      - name: Ping healthchecks.io
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: '[ -z "$HEALTHCHECK_URL" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"'
      - name: Save state
        if: always()
        run: bash .github/scripts/commit_state.sh "state ${{ matrix.company }}"
