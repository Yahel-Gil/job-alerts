name: digest

on:
  schedule:
    - cron: "0 18 * * *"   # 20:00 Israel winter time (21:00 in summer)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daily summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobwatch --digest
      # GitHub pauses scheduled workflows in repos with no commits for 60 days; this keeps it alive.
      - name: Heartbeat
        run: |
          date -u +%F > state/heartbeat.txt
          bash .github/scripts/commit_state.sh "heartbeat"
